# Prompt-leak Full 검사 — DB의 실제 사용자 데이터와 cross-check.
#
# regex-only 모드와 달리 DB 접근 필요. 운영 DB의 family_member/user_profile에서
# 실제 사용자 이름을 가져와 prompt 파일에 박혀있는지 정확 검출.
#
# 트리거:
#   - workflow_dispatch: 운영자가 GitHub UI에서 수동 실행
#   - schedule: 매일 한국 시각 새벽 3시 (UTC 18:00) 자동 실행
#
# 보안: DATABASE_URL은 GitHub Secrets에 저장. CI 환경에서만 접근.
#       이 저장소는 공개라 Actions 로그를 누구나 본다 — 검사 스크립트가 Actions에서는 걸린 값(가족 이름·고향)과
#       오류 속 DB 서버 주소를 가려 찍는다(scripts/prompt-leak-redact, 2026-11-20). 2026-11-20 옛 사본 저장소에서 이리로 옮겼다.

name: Prompt-leak Full Check (DB-backed)

on:
  workflow_dispatch:  # 수동 실행 가능
  schedule:
    - cron: '0 18 * * *'  # 매일 UTC 18:00 = KST 03:00

jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_URL: ${{ secrets.DATABASE_URL }}  # 없으면(백업 저장소 등) DB 검사 graceful skip

    steps:
      # DATABASE_URL secret이 없는 저장소(백업 미러 등)에서는 DB 검사를 건너뛴다.
      #   secret 부재로 매일 밤 실패 메일이 오던 것을 방지. secret이 있는 주 저장소는 정상 수행.
      - name: DB secret 확인
        if: ${{ env.DB_URL == '' }}
        run: echo "::notice::DATABASE_URL secret 미설정 — DB 대조 검사 건너뜀(이 저장소는 미러/보조). regex-only 검사는 CI에서 이미 수행."

      - uses: actions/checkout@v4
        if: ${{ env.DB_URL != '' }}
      - uses: actions/setup-node@v4
        if: ${{ env.DB_URL != '' }}
        with:
          node-version: '22.20.0'   # ci.yml과 동일 고정(2026-10-02)
          cache: 'npm'

      # onnxruntime-node는 설치 때 GPU(CUDA) 파일을 api.nuget.org에서 받는다 — 검사에 필요 없고(CPU 파일은 패키지 안에 있다),
      #   2026-11-20엔 그 서버 연결 시간 초과로 검사가 돌기도 전에 실패했다. skip이면 패키지 밖 파일을 받지 않는다(script/install.js).
      - run: npm ci
        if: ${{ env.DB_URL != '' }}
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      # 종료 코드를 남긴다 — 0 깨끗 / 1 누출 / 2 DATABASE_URL 없음 / 3 실행 오류(DB 연결 등). 아래 알림이 원인별로 다르게 찍는다.
      - name: Prompt-leak full (DB cross-check)
        id: leak
        if: ${{ env.DB_URL != '' }}
        run: |
          set +e
          npx tsx scripts/check-prompt-leak.ts
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
        env:
          DATABASE_URL: ${{ env.DB_URL }}

      # 실패 알림은 원인별로 — 2026-11-20 설치 실패도 "Prompt-leak detected!"로 와서 누출로 오해했다.
      - name: Notify on failure
        if: ${{ failure() && env.DB_URL != '' }}
        run: |
          if [ "${{ steps.leak.outputs.code }}" = "1" ]; then
            echo "::error::누출 발견 — 프롬프트 파일에 실제 사용자 데이터(가족 이름·고향 등)가 들어 있다. 로컬에서 npx tsx scripts/check-prompt-leak.ts로 확인"
          elif [ -n "${{ steps.leak.outputs.code }}" ]; then
            echo "::error::누출 검사가 끝까지 돌지 못했다(종료 코드 ${{ steps.leak.outputs.code }} — DB 연결 등). 누출이 아니다. 검사 단계 로그를 볼 것"
          else
            echo "::error::검사 전 단계(설치 등)가 실패해 누출 검사는 돌지 않았다 — 누출이 아니다. 외부 서버 일시 장애면 다시 돌리면 된다"
          fi
